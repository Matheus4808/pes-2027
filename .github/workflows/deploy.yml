# Publica o site no GitHub Pages a cada push na main.
# Valores do site: Settings > Secrets and variables > Actions > aba "Variables" (nomes VITE_*).
# Nada de segredo aqui: o build bloqueia VITE_* com cara de chave privada (vite.config.ts).
name: Deploy do site (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          # domínio próprio (CNAME) -> troque por '/'
          BASE_PATH: /${{ github.event.repository.name }}/
          VITE_BETA_URL: ${{ vars.VITE_BETA_URL }}
          VITE_CHECKOUT_URL: ${{ vars.VITE_CHECKOUT_URL }}
          VITE_PRICE: ${{ vars.VITE_PRICE }}
          VITE_PRICE_FROM: ${{ vars.VITE_PRICE_FROM }}
          VITE_LEAD_ENDPOINT: ${{ vars.VITE_LEAD_ENDPOINT }}
          VITE_CONTACT_EMAIL: ${{ vars.VITE_CONTACT_EMAIL }}
          VITE_DISCORD_URL: ${{ vars.VITE_DISCORD_URL }}
          VITE_YOUTUBE_URL: ${{ vars.VITE_YOUTUBE_URL }}
          VITE_INSTAGRAM_URL: ${{ vars.VITE_INSTAGRAM_URL }}
          VITE_TIKTOK_URL: ${{ vars.VITE_TIKTOK_URL }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}

      # SPA no Pages: rota desconhecida cai no index
      - run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
